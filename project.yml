name: GalaxyFit3
options:
  bundleIdPrefix: com.galaxyfit3
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO

targets:
  GalaxyFit3:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: .
        includes:
          - "*.swift"
        excludes:
          - "Info.plist"
          - "project.yml"
          - "*.sh"
          - "*.ipa"
          - "*.md"
          - "build/**"
          - "Payload/**"
          - ".github/**"
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_NAME: GalaxyFit3
        PRODUCT_BUNDLE_IDENTIFIER: com.galaxyfit3.smr390
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
