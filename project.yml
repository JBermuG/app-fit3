name: Fit3Link
options:
  bundleIdPrefix: com.fit3link
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    AD_HOC_CODE_SIGNING_ALLOWED: NO

targets:
  Fit3Link:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Fit3Link
    info:
      path: Fit3Link/Info.plist
      properties:
        CFBundleDisplayName: "Fit3 Link"
        CFBundleName: "Fit3Link"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # IMPORTANTE PARA SIDELOADLY (Cuenta Gratuita / Personal Team):
        # NO incluir "healthkit" en UIRequiredDeviceCapabilities para evitar bloqueo de firma gratuita.
        UIRequiredDeviceCapabilities:
          - arm64
          - bluetooth-le
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: "Fit3 Link necesita acceso a Bluetooth para conectarse en segundo plano con tu Samsung Galaxy Fit 3, recibir pasos, frecuencia cardíaca, sueño y habilitar notificaciones ANCS."
        NSBluetoothPeripheralUsageDescription: "Fit3 Link utiliza Bluetooth para comunicarse con tu pulsera Samsung Galaxy Fit 3."
        NSHealthShareUsageDescription: "Fit3 Link puede consultar datos de salud de forma opcional si el perfil de firma lo permite."
        NSHealthUpdateUsageDescription: "Fit3 Link puede guardar pasos, frecuencia cardíaca, SpO2 y sueño en Apple Health si el perfil de firma lo permite."
        LSApplicationQueriesSchemes:
          - shortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fit3link.app
        PRODUCT_NAME: Fit3Link
        INFOPLIST_FILE: Fit3Link/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - sdk: CoreBluetooth.framework
      - sdk: SwiftData.framework
      - sdk: Charts.framework
      - sdk: HealthKit.framework
        weak: true
